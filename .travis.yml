language: ruby
rvm:
- 2.4.0
before_script:
- chmod +x ./scripts/cibuild.sh
script: "./scripts/cibuild.sh"
env:
  matrix:
  - COMMIT_AUTHOR_EMAIL: joseph.luccisano@gmail.com
  global:
    secure: 
sudo: false
branches:
  only:
  - develop
notifications:
  email: false
after_success:
- bash ./scripts/deploy.sh
before_install:
- openssl aes-256-cbc -K $encrypted_8ebb1ef83f64_key -iv $encrypted_8ebb1ef83f64_iv
  -in github_deploy_key.enc -out github_deploy_key -d
